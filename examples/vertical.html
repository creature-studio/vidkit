<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>竖屏短视频 · vidkit 示例</title></head>
<body>
<script src="../dist/vidkit.js"></script>
<script>
// 9:16 vertical short (~15s) for 抖音 / 小红书: bold kinetic type on a 128 BPM grid, cuts on beats,
// everything inside the platform safe zones (top bar, right rail, bottom info). Press `s` in preview to see them.
// Presets: stack, squash, scramble, words, stretch, count, badge, terminal, whip/glitch/zoom-through/shape-star/flash
// transitions, beatZoom, shake, rgb + scanlines + grain, dots/mesh backgrounds, captions, beat-kick score.
const v = vk.video({
  format: '9:16', fps: 30, theme: 'bold', title: '用代码做视频的 3 个理由', bpm: 128,
  transition: 'whip-up:0.35', autoSfx: true,
  texture: { grain: { amount: .06 } },
  scoreOptions: { beatKick: 2, pad: [110, 138.59, 164.81], padGain: .015 },
});
const B = n => n * 60 / 128;           // beats → seconds (scene lengths land on the grid)

vk.scene('钩子', B(6), { bg: 'accent', sfx: false, cap: '用代码做视频的 3 个理由' }, [
  vk.stack(['用代码', '做视频的', '**3 个**理由'], { at: .1, each: B(.5), w: 560 }),
]);

vk.scene('01 可复现', B(7), { bg: [{ type: 'dots', drift: 30 }], mode: 'dark', transition: 'glitch:0.4', cap: '一：可复现，每一帧都是时间的函数' }, [
  vk.badge('01', { at: .1, size: 40, hl: true }),
  vk.title('可复现', { fx: 'squash', at: .3, size: 150, mt: 30, font: 'display' }),
  vk.text('render(t) 纯函数', { fx: 'scramble', at: 1.0, font: 'mono', size: 40, mt: 20 }),
  vk.sub('同一份脚本，**每一帧都一样**', { at: 1.3, fx: 'words', each: .05, size: 38, mt: 16 }),
], ).beatZoom(.025);

vk.scene('02 能批量', B(7), { bg: 'light', transition: 'zoom-through:0.5', cap: '二：能批量，改数据就是一条新视频' }, [
  vk.badge('02', { at: .1, size: 40, hl: true }),
  vk.title('能批量', { fx: 'letters', at: .3, size: 150, mt: 30, font: 'display' }),
  vk.row([vk.title('×', { fx: 'pop', at: 1.0, size: 90 }), vk.ticker(100, { at: 1.0, d: 1.2, size: 150, color: 'accent' })], { gap: 10, mt: 10, alignItems: 'center' }),
  vk.sub('改一行 JSON\n就是一条新视频', { at: 1.9, fx: 'up', size: 38, mt: 10 }),
]);

vk.scene('03 有质感', B(7), { bg: [{ type: 'mesh' }], mode: 'dark', transition: 'shape-star:0.5', shake: [{ t: B(1), amp: 14, d: .4 }], texture: { rgb: { amount: 3, pulse: 3 }, scanlines: { amount: .18 } }, cap: '三：有质感，转场纹理一行配置' }, [
  vk.badge('03', { at: .1, size: 40, hl: true }),
  vk.title('STRETCH', { fx: 'stretch', at: B(1) - .15, d: .5, size: 104, mt: 30, font: 'display' }),
  vk.title('有质感', { fx: 'squash', at: B(2), size: 120, mt: 6 }),
  vk.row(['30+ 转场', '纹理', '镜头'].map((s, i) => vk.badge(s, { at: B(3) + i * B(.5), size: 30, hl: i === 0 })), { gap: 12, mt: 24 }),
]);

vk.scene('行动', B(8), { bg: 'accent', transition: 'flash:0.3', cap: '一个 HTML 文件，一条命令出片' }, [
  vk.title('一个 HTML\n一条命令', { fx: 'words', at: .2, size: 96 }),
  vk.terminal(['$ vk render short.html'], { at: 1.2, w: 540, size: 26, mt: 36 }),
  vk.small('vidkit · 本地 · 确定性渲染', { at: 2.6, mt: 24, size: 26 }),
]);
</script>
</body>
</html>
