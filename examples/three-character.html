<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>vk.three character — GLB + mixer timeline</title></head>
<body>
<script src="../dist/vidkit.js"></script>
<script src="../dist/vidkit-three.js"></script>
<script>
// A rigged GLB (RobotExpressive, CC0, added with `vk asset add` → assets/models/robot.glb, meshopt-compressed) driven by
// a mixer TIMELINE: clips cross-fade as a pure function of t (seekable, parallel-render safe). The second scene runs
// the same model through an NPR look chain (toon + outline + halftone) — no character-specific style code.
const v = vk.video({ fps: 30, theme: 'tech-blue', transition: 'fade:0.4' });
const R = vk.three.rig, ROBOT = 'assets/models/robot.glb';
vk.scene('timeline', 6.5, { bg: '#e9e5de', mode: 'light', layout: 'top' }, sc => {
  sc.three(vk.three.model(ROBOT, { size: 2, ground: { color: '#d6cfc4', radius: 6 },
    timeline: [{ t: 0, clip: 'Idle' }, { t: 1.2, clip: 'Walking', fade: .4 }, { t: 3, clip: 'Wave', fade: .35 }, { t: 4.4, clip: 'Dance', fade: .4 }] }),
    { background: 0xe9e5de, env: 'studio', camera: R.orbit({ target: [0, 1.45, 0], radius: 4.8, height: 1.5, from: -25, to: 20, dur: 6.5, fov: 34 }) });
  sc.add(vk.label('GLB · MIXER TIMELINE', { at: .3 }), vk.h2('Idle → Walk → **Wave** → Dance', { at: .5 }));
  sc.add(vk.small('RobotExpressive · CC0 · Tomás Laulhé (Quaternius)', { at: 1 }));
});
vk.scene('toon', 4.5, { bg: '#f3e9d2', mode: 'light', layout: 'top' }, sc => {
  sc.three(vk.three.model(ROBOT, { size: 2, ground: { color: '#f0d9a8', radius: 6 }, timeline: [{ t: 0, clip: 'Dance' }, { t: 2.6, clip: 'Jump', fade: .25, loop: false }, { t: 3.6, clip: 'ThumbsUp', fade: .3, loop: false }] }),
    { background: 0xf3e9d2, camera: R.orbit({ target: [0, 1.45, 0], radius: 4.6, height: 1.3, from: 30, to: -10, dur: 4.5, fov: 34 }), post: { look: 'comic' } });
  sc.add(vk.h2('same rig · **look: comic**', { at: .3 }));
});
</script>
</body>
</html>
