<script>
// 《哪吒闹海》— 基于中国神话/民间传说的家庭友好改编：强调护民、担当与止息风浪。
const v = vk.video({
  format: '16:9', fps: 30, theme: 'ink', title: '哪吒闹海', transition: 'ink:1.0',
  texture: { rice: { amount: .54, seed: 12, vignette: .24 } },
  bpm: 84, autoSfx: true,
  scoreOptions: { pad: [98, 146.83, 220], padGain: .018, beatKick: 4 },
});
vk.installInk({ prefix: 'nz', boil: 6, scale: 1.1 });

const { clamp, kf, kfSpline: ks, bump, plat } = vk;
const sm = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const R = n => Math.round(n * 10) / 10;
function svg(parent, markup) { parent.insertAdjacentHTML('beforeend', markup.trim()); return parent.lastElementChild; }
function tr(el, x, y, s = 1, r = 0, flip = 1) { el.setAttribute('transform', `translate(${R(x)} ${R(y)}) rotate(${R(r)}) scale(${R(s * flip)} ${R(s)})`); }
function op(el, v) { el.style.opacity = String(clamp(v, 0, 1)); }
function sinePath(y, amp, phase, step = 34) {
  let d = `M -50 ${R(y)}`;
  for (let x = -50; x <= 1330; x += step) {
    const yy = y + Math.sin(x * .016 + phase) * amp + Math.sin(x * .037 + phase * .63) * amp * .28;
    d += ` L ${R(x)} ${R(yy)}`;
  }
  return d;
}
function seaFillPath(y, amp, phase) { return sinePath(y, amp, phase, 30) + ' L 1330 760 L -50 760 Z'; }
function dragonPath(t, amp = 36, len = 580) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const u = i / 9, x = -len / 2 + u * len;
    const y = Math.sin(u * Math.PI * 2.25 + t) * amp * (0.65 + u * .45);
    pts.push([x, y]);
  }
  return 'M ' + pts.map(p => `${R(p[0])} ${R(p[1])}`).join(' L ');
}
function makeWorld(sc, o = {}) {
  const cls = ['nz-root', o.mood || '', o.under ? 'under' : ''].join(' ');
  const seaY = o.seaY == null ? (o.under ? 92 : 314) : o.seaY;
  const root = sc.html(`<div class="${cls}">
    <svg viewBox="0 0 1280 720" aria-hidden="true">

      <path class="mount" d="M-30 297 C100 220 164 254 220 214 C312 150 405 245 492 188 C610 111 704 226 790 176 C894 116 1000 243 1130 180 C1210 142 1290 208 1340 176 L1340 382 L-30 382Z"/>

        <path d="M344 368 L420 314 L498 368 Z"/><rect x="370" y="366" width="98" height="62"/>
      </g>
      <g class="palace">
        <path class="roof" d="M406 494 C482 430 616 420 704 494 L382 494 C456 458 616 456 726 494"/>
        <rect class="wall" x="438" y="494" width="236" height="118" rx="12"/>
        <path class="roof" d="M498 424 C560 370 650 383 696 430 L472 430 C530 400 620 398 718 430"/>
        <rect class="wall" x="526" y="430" width="140" height="70" rx="10"/>
        <circle class="pearl" cx="606" cy="403" r="15"/>
        <path class="wall" d="M460 612 L446 668 M520 612 L508 670 M590 612 L590 674 M660 612 L678 668"/>
      </g>
      <path class="sea-fill" d="M0 310 L1280 310 L1280 720 L0 720Z"/>
      <path class="sea-shadow" d="M0 450 C220 420 420 470 650 432 C860 397 1030 472 1280 420 L1280 720 L0 720Z"/>

        <path class="wave w0"/><path class="wave w1"/><path class="wave w2"/><path class="wave w3"/>

      <g class="rain">
        ${Array.from({ length: 34 }, (_, i) => `<path d="M${40 + i * 38} ${88 + (i % 5) * 28} l-22 48"/>`).join('')}

      </g>

        ${Array.from({ length: 18 }, (_, i) => `<circle class="bubble b${i}" cx="${80 + (i * 67) % 1140}" cy="${170 + (i * 83) % 500}" r="${6 + (i % 4) * 4}"/>`).join('')}

      <g class="sparks"></g>
    </svg>

  </div>`);
  if (sc.cam) sc.cam.insertBefore(root, sc.content);

  const $ = s => root.querySelector(s), $$ = s => [...root.querySelectorAll(s)];
  const sea = $('.sea-fill'), waves = $$('.wave'), fronts = $$('.front-wave'), foam = $$('.foam'), clouds = $$('.cloud'), palace = $('.palace'), note = root.querySelector('.nz-note');
  op(palace, o.palace ? 1 : 0);
  sc.on(l => {
    const storm = o.storm ? o.storm(l) : (o.mood === 'storm' ? .9 : 0);
    sea.setAttribute('d', seaFillPath(seaY + storm * 18, (o.amp || 18) + storm * 15, l * (.52 + storm * .32) + (o.phase || 0)));
    waves.forEach((w, i) => w.setAttribute('d', sinePath(seaY + 40 + i * 64, (8 + i * 2) * (1 + storm * 1.35), l * (.9 + i * .17) + i * 1.8, 32)));
    fronts.forEach((w, i) => w.setAttribute('d', sinePath(seaY + 76 + i * 110, 7 + storm * 9, l * (1.4 + i * .25) + i, 42)));
    foam.forEach((w, i) => w.setAttribute('d', sinePath(seaY + 92 + i * 126, 5 + storm * 7, l * (1.6 + i * .22), 52)));

    if (palace) op(palace, (o.palace ? .78 : 0) * (o.under ? 1 : .55));
    if (note) note.style.transform = `translateY(${R(Math.sin(l * .8) * 3)}px)`;
    $$('.bubble').forEach((b, i) => {
      const yy = 720 - ((l * (22 + i % 5 * 8) + i * 67) % 660);
      b.setAttribute('cy', R(yy)); b.setAttribute('cx', R(80 + (i * 67) % 1140 + Math.sin(l + i) * 9));

}
function makeNezha(parent, cls = '') {
  return svg(parent, `<g class="nz-actor nezha ${cls}">
    <path class="silk silk1" d="M-116 -54 C-178 -118 -246 -70 -248 -18 C-250 56 -146 50 -116 8"/>
    <path class="silk silk2" d="M28 -38 C106 -100 186 -48 164 24 C148 76 76 78 38 24"/>
    <line class="spear" x1="-78" y1="-50" x2="96" y2="-126"/>
    <path class="gold" d="M96 -126 l28 -2 l-20 22 Z"/>
    <circle class="wheel" cx="-28" cy="22" r="20"/><circle class="wheel" cx="38" cy="22" r="20"/>
    <path class="red" d="M-33 -57 C-20 -78 22 -78 36 -56 L48 -8 C20 8 -18 8 -47 -8 Z"/>
    <path class="line" d="M-32 -48 C-62 -38 -78 -16 -88 10 M34 -50 C58 -42 72 -25 86 -6"/>
    <path class="line" d="M-24 -6 L-44 22 M26 -6 L42 22"/>
    <circle class="skin" cx="0" cy="-104" r="31"/>
    <circle class="hair" cx="-26" cy="-130" r="14"/><circle class="hair" cx="27" cy="-130" r="14"/>
    <path class="red" d="M-43 -130 q17 -18 34 0 M10 -130 q17 -18 34 0"/>
    <circle class="ink" cx="-10" cy="-108" r="3.8"/><circle class="ink" cx="12" cy="-108" r="3.8"/>
    <path class="line" style="stroke-width:3" d="M-9 -91 Q2 -85 15 -92"/>

}
function makeDragon(parent, opts = {}) {
  return svg(parent, `<g class="nz-actor dragon ${opts.king ? 'king' : ''}">
    <path class="body"/><path class="belly"/>
    <g class="head">
      <path class="head-fill" d="M-10 -44 C42 -76 112 -52 128 3 C142 52 83 83 32 64 C-14 47 -42 -10 -10 -44Z"/>
      <path class="horn" d="M38 -52 C28 -88 46 -112 70 -128 M78 -48 C92 -86 120 -100 146 -108"/>
      ${opts.king ? '<path class="crown" d="M34 -75 L52 -116 L72 -78 L96 -118 L108 -72 Z"/>' : ''}
      <circle class="eye" cx="72" cy="-17" r="10"/><circle class="eye" cx="105" cy="0" r="8"/>
      <circle class="scale" cx="75" cy="-17" r="3"/><circle class="scale" cx="108" cy="0" r="3"/>
      <path class="whisker" d="M106 28 C156 30 178 56 208 74 M83 42 C126 70 132 96 156 128"/>

}
function updateDragon(g, t, amp = 34, len = 590) {
  const d = dragonPath(t, amp, len);
  g.querySelector('.body').setAttribute('d', d);
  g.querySelector('.belly').setAttribute('d', d);
  const hx = len / 2, hy = Math.sin(Math.PI * 2.25 + t) * amp * 1.1;
  const py = Math.sin((8 / 9) * Math.PI * 2.25 + t) * amp * (0.65 + 8 / 9 * .45);
  const ang = Math.atan2(hy - py, len / 9) * 180 / Math.PI;
  g.querySelector('.head').setAttribute('transform', `translate(${R(hx)} ${R(hy)}) rotate(${R(ang)})`);

function makeBoat(parent) {
  return svg(parent, `<g class="nz-actor boat">
    <path class="hull" d="M-112 0 C-76 48 76 52 116 0 C54 16 -46 16 -112 0Z"/>
    <path class="sail" d="M-8 -122 L-8 -12 L76 -20 C52 -72 26 -102 -8 -122Z"/>

function makeYaksha(parent) {
  return svg(parent, `<g class="nz-actor yaksha">
    <path class="body" d="M-46 -12 C-58 -66 -12 -103 35 -78 C80 -54 70 10 30 35 C-9 59 -38 28 -46 -12Z"/>

    <circle class="eye" cx="2" cy="-35" r="9"/><circle class="eye" cx="36" cy="-28" r="8"/>
    <path class="trident" d="M76 -110 L24 58 M62 -100 L91 -124 M66 -86 L102 -92"/>

}
function makeRing(parent) { return svg(parent, '<g class="ring"><circle cx="0" cy="0" r="34"/><circle cx="0" cy="0" r="19" stroke-width="5" opacity=".72"/></g>'); }
function spark(parent, x, y, r = 58) { return svg(parent, `<path class="spark" d="M${x} ${y-r} L${x+12} ${y-12} L${x+r} ${y} L${x+12} ${y+12} L${x} ${y+r} L${x-12} ${y+12} L${x-r} ${y} L${x-12} ${y-12}Z"/>`); }

/* ============================================================ 0 · title */
vk.scene('片头', 6.6, { transition: 'none', cap: '东海边，陈塘关外，潮声连着人间。' }, (sc) => {

  const nz = makeNezha(W.actors);
  const dr = makeDragon(W.actors);
  sc.on(l => {
    tr(nz, 954 + Math.sin(l * .7) * 4, 440 + Math.sin(l * 1.1) * 3, .92, Math.sin(l) * 2, -1);
    tr(dr, 510, 470 + Math.sin(l * .5) * 8, .56, -4); updateDragon(dr, l * .9, 28, 650); op(dr, .26 + .06 * Math.sin(l));
  });
  sc.sfx(.2, 'gong', .9, 92); sc.sfx(1.8, 'pluck', .5, 392); sc.sfx(4.5, 'ripple', .45);
  sc.add(vk.vtitle('哪吒闹海', { sub: '少年护民　水墨神话短片', seal: '闹海', size: 116, at: .55, sealAt: 2.1, out: 5.8, outD: .6 }));
});

/* ============================================================ 1 · seaside */
vk.scene('海边惊涛', 8.2, {
  transition: { type: 'ink', d: 1.0, x: .62, y: .46 },
  cap: ['近来东海妖风作浪，渔船常常回不了港。', '哪吒听见哭声，提枪奔向海边。'],
}, (sc) => {
  const W = makeWorld(sc, { mood: 'storm', seaY: 286, amp: 20, note: '第一折<br>海边惊涛' });
  const boat = makeBoat(W.actors), yk = makeYaksha(W.actors), nz = makeNezha(W.actors);
  sc.on(l => {
    tr(boat, 420 + Math.sin(l * 1.5) * 12, 396 + Math.sin(l * 2.1) * 18, .92, Math.sin(l * 2.4) * 7);
    const yp = plat(l, .8, 1.7, 5.4, 6.2);
    tr(yk, 704 + Math.sin(l * 2) * 18, 395 + Math.sin(l * 2.6) * 24 - yp * 40, .82, Math.sin(l * 2.2) * 8); op(yk, yp);
    const p = sm((l - 2.3) / 2.2);

  sc.add(vk.chapter('海边惊涛', { no: '一', at: .7, out: 7.3 }));
}).shake(1.0, 9, 1.1).shake(5.6, 12, .8);

/* ============================================================ 2 · dive */
vk.scene('投圈入海', 8.0, {
  transition: { type: 'wash', d: 1.0 },
  cap: ['哪吒把乾坤圈一抛，海面炸开银白的浪花。', '混天绫随浪展开，他要到龙宫问个明白。'],

  const nz = makeNezha(W.actors), ring = makeRing(W.actors), yk = makeYaksha(W.actors);
  const burst = spark(W.sparks, 640, 300, 92);
