<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鲁智深倒拔垂杨柳 · 剪纸动画短片（vidkit · 骨骼版）</title>
</head>
<body>
<script src="../../dist/vidkit.js"></script>
<script src="../wusong/lib/papercut.js"></script>
<script src="../wusong/lib/jingyang.js"></script>
<script src="lib/luzhishen-rig.js"></script>
<script src="lib/poxi-rig.js"></script>
<script src="lib/garden.js"></script>
<script>
// 《鲁智深倒拔垂杨柳》— after 《水浒传》第七回. Shanghai Animation Film Studio style: paper-cut (剪纸) characters with
// scissor edges, grain and drop shadows over an ink-wash garden; 京剧锣鼓 synthesised in code; storyteller + 鲁智深 VO.
// Everything is a pure function of the scene time t (rigs: lib/*-rig.js, garden + willow: lib/garden.js,
// paper-cut kit and 锣鼓: ../wusong/lib/papercut.js, ink world: ../wusong/lib/jingyang.js).
const v = vk.video({
  format: '16:9', fps: 30, theme: 'ink', title: '鲁智深倒拔垂杨柳', transition: 'ink:1.0',
  texture: { rice: { amount: .5, seed: 7, vignette: .26 } },
  voice: { manifest: 'luzhishen.vo.json', voice: 'zh-CN-YunjianNeural', rate: '+2%', pitch: '-2Hz', lead: .4, tail: .6, gap: .25, maxChars: 18,
    cast: { lu: { voice: 'zh-CN-YunyeNeural', rate: '-4%', pitch: '-8Hz' } } },
  karaoke: 'sweep',
  mix: { lufs: -14, duck: -8 },
  scoreOptions: { pad: [73.42, 110, 164.81], padGain: .012 },
});
WJ.defs(v);

const { sm, clamp } = WJ;
const R = n => Math.round(n * 10) / 10;
const lerp = (a, b, u) => a + (b - a) * u;
// eased keyframes [[t, v], …] (smoothstep between keys)
const K = (t, keys) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [t1, v1] = keys[i]; if (t <= t1) { const [t0, v0] = keys[i - 1]; return v0 + (v1 - v0) * sm((t - t0) / (t1 - t0 || 1)); } } return keys[keys.length - 1][1]; };
const Kl = (t, keys) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [t1, v1] = keys[i]; if (t <= t1) { const [t0, v0] = keys[i - 1]; return v0 + (v1 - v0) * clamp((t - t0) / (t1 - t0 || 1)); } } return keys[keys.length - 1][1]; };
const hop = (t, t0, t1, h) => { const u = (t - t0) / (t1 - t0); return u <= 0 || u >= 1 ? 0 : 4 * h * u * (1 - u); };
const bump = (t, a, b, e = .25) => sm((t - a) / e) * (1 - sm((t - b) / e));
// word time inside VO line i (from the manifest's word boundaries when present)
function at(sc, i, phrase) {
  const s = sc.voSegs && sc.voSegs[i]; if (!s) return 0; if (!phrase) return s.at;
  const clean = phrase.replace(/[，。！？、：；“”《》\s—]/g, '');
  if (!s.words) { const idx = s.text.replace(/[，。！？、：；“”《》\s—]/g, '').indexOf(clean); return s.at + Math.max(0, idx) / s.text.length * s.dur; }
  const chars = s.words.map(w => w.w).join(''), idx = chars.indexOf(clean); if (idx < 0) return s.at;
  let c = 0; for (const w of s.words) { if (c + w.w.length > idx) return s.at + w.t; c += w.w.length; } return s.at;
}
const LZ_S = .5, PX_S = .44, GY = 592;
const lzY = (gy, s = LZ_S) => gy - LZR.SOLE * s;
const pxY = (gy, s = PX_S) => gy - PXR.SOLE * s;
const grassRow = (xs, gy, o = {}) => xs.map((x, i) => ({ x, y: (typeof gy === 'function' ? gy(x) : gy) + 6, n: o.n || 5, h: (o.h || 28) + (i % 3) * 8 }));

/* 老鸦 caw — a short raspy two-call cry, synthesised in code (deterministic, no assets) */
vk.register('sounds', 'caw', (k, t, gain = 1) => k.buf(t, 'caw', () => {
  const sr = k.sr, dur = .62, n = Math.floor(sr * dur), out = new Float32Array(n);
  let seed = 7, rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296 * 2 - 1; };
  const calls = [[0, .2, 1], [.3, .26, .82]];
  for (let i = 0; i < n; i++) {
    const t0 = i / sr; let s = 0;
    for (const [cs, cd, cg] of calls) {
      if (t0 < cs || t0 > cs + cd) continue;
      const u = (t0 - cs) / cd, env = Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.15)), .7);
      const f = 640 * (1 + .35 * Math.exp(-u * 9)) * (1 - .18 * u);
      let h = 0; for (let k2 = 1; k2 <= 7; k2++) h += Math.sin(2 * Math.PI * f * k2 * t0 + Math.sin(t0 * 70) * .6) / (k2 * 1.25);
      s += (h * .5 + rnd() * .42) * env * cg;
    }
    out[i] = s;
  }
  let m = 0; for (let i = 0; i < n; i++) m = Math.max(m, Math.abs(out[i]));
  if (m > 0) for (let i = 0; i < n; i++) out[i] = out[i] / m * .8;
  return out;
}, .5 * gain));

/* ═══════════════ 0 片头 ═══════════════ */
vk.scene('片头', 8.2, { transition: 'wash:1', vo: [{ text: '话说《水浒传》里，有一段花和尚倒拔垂杨柳的故事。', at: 2.2 }] }, sc => {
  sc.el.classList.add('ws-title');
  const gy = x => 604 - 40 * Math.exp(-Math.pow((x - 300) / 420, 2));
  const W = WJ.world(sc, { mood: 'dusk', sun: { x: 250, y: 220, r: 56 }, ground: gy, farTop: 320, midTop: 460, midAmp: 64, seed: 3.4,
    mist: [{ y: 470, h: 58, op: .5 }, { y: 552, h: 44, op: .36 }],
    pines: [{ x: 1120, y: 560, h: 120, seed: 4 }, { x: 60, y: 580, h: 140, seed: 9 }],
    grass: grassRow([120, 250, 470, 640, 760], gy, { h: 22 }) });
  W.props.insertAdjacentHTML('beforeend', CY.wall(-40, 880, 452, 96));
  const willow = CY.willow(sc, W.actors, { x: 340, y: gy(340), scale: .84, seed: 5 });
  const lz = LZR.luzhishen(W.actors), act = lz.play([{ at: 0, clip: 'walk', speed: .78 }]);
  sc.on(l => {
    willow.update(l, { wind: .3 + .12 * Math.sin(l * .7), scale: .82 });
    const x = 560 + l * 34;
    lz.render(l, act, { x, y: gy(x) - LZR.SOLE * .3, scale: .3 }, { staff: 1, wind: .3 });
  });
  sc.add(vk.vtitle('倒拔垂杨柳', { sub: '水浒传·大相国寺菜园　剪纸动画', seal: '水浒', size: 108, at: .4, sealAt: 3.4, pos: { x: 986, y: 60 }, out: 6.8, outD: .8 }));
  const mainEl = () => sc.el.querySelector('.vk-vt-main');
  const mask = vk.gl.draw(g => {
    const m = mainEl(); if (!m) return;
    let x = 0, y = 0; for (let e = m; e && e !== sc.el; e = e.offsetParent) { x += e.offsetLeft; y += e.offsetTop; }
    const cs = getComputedStyle(m), size = parseFloat(cs.fontSize);
    g.font = `${size}px ${cs.fontFamily}`; g.fillStyle = '#000'; g.textAlign = 'center'; g.textBaseline = 'top';
    [...m.textContent].forEach((ch, i) => g.fillText(ch, x + m.offsetWidth / 2, y + i * size * 1.04));
  }, { static: true });
  sc.gl([vk.gl.inkBleed({ src: mask, at: .4, draw: .9, dur: 2.8, spread: 7, haloEnd: .24, density: .96, halo: .3, rim: .22, wipe: { dir: 'down', dur: 1.7 }, fade: [6.7, 7.4], seed: 4 })], { rect: [890, 0, 390, 720] });
  WS.luogu(sc, .15, 'sijitou', { gain: .9 });
  WS.stroke(sc, 3.4, 'tai', .7);
  sc.sfx(1.2, 'wind', .32, 4);
});

/* ═══════════════ 1 看管菜园 ═══════════════ */
vk.scene('看管菜园', 12.8, { vo: [
  { text: '这鲁智深，被派去看管大相国寺的菜园。', at: .5 },
  { text: '园边那二三十个泼皮，一心想把这胖大和尚哄到窖边，掀他下去。', at: 5.0 },
] }, sc => {
  const W = WJ.world(sc, { mood: 'dusk', ground: GY, farTop: 330, midTop: 470, midAmp: 60, seed: 8.2,
    mist: [{ y: 470, h: 52, op: .42 }], grass: grassRow([40, 150, 1180, 1250], GY, { h: 24 }) });
  W.props.insertAdjacentHTML('beforeend', CY.wall(-40, 1320, 400, 120));
  W.props.insertAdjacentHTML('beforeend', CY.beds([{ y: 556, x0: 120, x1: 560, n: 5, s: .9 }, { y: 596, x0: 60, x1: 640, n: 6, s: 1 }]));
  W.props.insertAdjacentHTML('beforeend', CY.pit(1066, 560, 230, { h: 50 }));
  W.props.insertAdjacentHTML('beforeend', CY.fence(700, 1010, 540, { h: 78, seed: 3 }));
  vk.bake(W.props, { scale: 1 });
  const willow = CY.willow(sc, W.actors, { x: 880, y: 540, scale: .52, seed: 2 });
  const lz = LZR.luzhishen(W.actors);
  const act = lz.play([{ at: 0, clip: 'walk', speed: .8 }, { at: 5.3, clip: 'idle', blend: .45 }, { at: 7.6, clip: 'look', blend: .5 }, { at: 10.6, clip: 'idle', blend: .6 }]);
  // two rogues crouching behind the fence, whispering and peeking
  const pxs = [PXR.poxi(W.actors, PXR.PALETTES[0]), PXR.poxi(W.actors, PXR.PALETTES[1])];
  const pacts = pxs.map((p, i) => p.play([{ at: 0, clip: 'sneak', speed: .5, offset: i * .7 }, { at: 7.0 + i * .3, clip: 'point', blend: .4 }, { at: 10.4 + i * .3, clip: 'sneak', speed: .5, blend: .5 }]));
  sc.on(l => {
    willow.update(l, { wind: .22 + .1 * Math.sin(l * .8), scale: .52 });
    const x = Kl(l, [[0, 120], [5.3, 470], [12.8, 470]]);
    lz.render(l, act, { x, y: lzY(GY), scale: LZ_S }, { staff: 1, wind: .3 });
    pxs.forEach((p, i) => {
      const bx = 812 + i * 118, bob = Math.sin(l * 2 + i * 1.6) * 3;
      p.render(l, pacts[i], { x: bx, y: pxY(552) + bob, scale: PX_S, flip: -1 }, { blinkOffset: i * .8, face: l > 7.0 && l < 10.2 && i === 0 ? 'shout' : null });
    });
  });
  [1.1, 2.0, 2.9, 3.8].forEach(t => WS.stroke(sc, t, 'tai', .42));
  WS.luogu(sc, 5.4, 'hit', { gain: .6 });
  sc.sfx(7.4, 'caw', .34);
  sc.sfx(11.4, 'caw', .28);
});

/* ═══════════════ 2 一脚一个 ═══════════════ */
vk.scene('一脚一个', 12.2, { vo: [
  { text: '两个泼皮抢上来，一个扳他的左脚，一个扳他的右脚。', at: .4 },
  { text: '不想这和尚脚下生风，两个泼皮都翻下窖去！', at: 5.4 },
] }, sc => {
  const W = WJ.world(sc, { mood: 'dusk', ground: GY, farTop: 330, midTop: 470, midAmp: 60, seed: 4.6,
    mist: [{ y: 470, h: 50, op: .4 }], grass: grassRow([40, 160, 300, 1230], GY, { h: 26 }) });
  W.props.insertAdjacentHTML('beforeend', CY.wall(-40, 1320, 400, 120));
  W.props.insertAdjacentHTML('beforeend', CY.beds([{ y: 552, x0: 80, x1: 420, n: 4, s: .85 }]));
  W.props.insertAdjacentHTML('beforeend', CY.pit(1080, 584, 300, { h: 62 }));
  vk.bake(W.props, { scale: 1 });
  const PITX = 1080, PITY = 584;
  const lz = LZR.luzhishen(W.actors);
  const K1 = 3.4, K2 = 6.6, LAUGH = 8.6;               // kick impacts
  const act = lz.play([{ at: 0, clip: 'idle' }, { at: K1 - .55, clip: 'kick', local: true, blend: .18 },
    { at: K1 + .95, clip: 'idle', blend: .35 }, { at: K2 - .55, clip: 'kick', local: true, blend: .18 },
    { at: K2 + .95, clip: 'idle', blend: .35 }, { at: LAUGH, clip: 'laugh', blend: .4 }]);
  // the two rogues: creep in → grab → get kicked → fly into the pit → sit in it
  const rogue = (i, pal, kick, x0, x1) => {
    const px = PXR.poxi(W.actors, pal);
    const act2 = px.play([{ at: 0, clip: 'sneak', speed: .9, offset: i * 1.3 }, { at: kick - 1.1, clip: 'grab', local: true, blend: .25 },
      { at: kick, clip: 'tumble', blend: .08 }, { at: kick + 1.15, clip: 'sit', blend: .25 }]);
    const FLY = 1.15;                                   // flight time from kick to landing in the pit
    return { px, act: act2, kick, render(l) {
      let root;
      if (l < kick) root = { x: Kl(l, [[0, x0], [kick - 1.1, x1], [kick, x1 - 8]]), y: pxY(GY), scale: PX_S, flip: -1 };
      else if (l < kick + FLY) {
        const u = (l - kick) / FLY;
        root = { x: lerp(x1 - 8, PITX + (i ? 40 : -40), u), y: pxY(GY) - 4 * 150 * u * (1 - u) + u * u * 26, scale: PX_S, flip: -1, rot: -300 * u };
      } else {
        const s = clamp((l - kick - FLY) / .5);
        root = { x: PITX + (i ? 40 : -40), y: PITY - 14 - (1 - s) * 6, scale: PX_S * (1 - .06 * s), flip: -1, rot: lerp(-300, -360, s) };
      }
      this.px.render(l, this.act, root, { blinkOffset: i * .6, face: l > kick - .15 && l < kick + 1.2 ? 'shout' : (l > kick + FLY ? 'shut' : null) });
    } };
  };
  const rs = [rogue(0, PXR.PALETTES[0], K1, 1140, 760), rogue(1, PXR.PALETTES[2], K2, 1180, 800)];
  sc.on(l => {
    const x = 640;
    lz.render(l, act, { x, y: lzY(GY), scale: LZ_S, flip: 1 }, { staff: 1, wind: .3,
      face: bump(l, K1 - .2, K1 + .5, .1) + bump(l, K2 - .2, K2 + .5, .1) + bump(l, LAUGH, 12.2, .2) > .5 ? 'shout' : null });
    rs.forEach(r => r.render(l));
  });
  // 泥水四溅 when each rogue lands in the pit
  sc.gl([CY.soilBurst({ t: K1 + 1.15, n: 30, x: PITX - 40, y: PITY - 6, seed: 3, color: '#4e3c24', color2: '#8d7145' }),
    CY.soilBurst({ t: K2 + 1.15, n: 30, x: PITX + 40, y: PITY - 6, seed: 8, color: '#4e3c24', color2: '#8d7145' })], { zIndex: 8 });
  [K1, K2].forEach((t, i) => {
    WJ.bigChar(sc, '踢', t + .02, { x: 150 + i * 60, y: 96, size: 150, out: t + 1.2 });
    sc.sfx(t - .35, 'swish', .8); sc.sfx(t, 'thud', .9); WS.luogu(sc, t, 'hit', { gain: 1 }); sc.shake(t, 12, .45);
    sc.sfx(t + 1.12, 'splash', .85); WS.stroke(sc, t + 1.15, 'cang', .8); sc.shake(t + 1.15, 7, .35);
  });
  WS.jijifeng(sc, .4, 4, { bpm: 150, gain: .34 });
  WS.luogu(sc, LAUGH - .1, 'sijitou', { gain: .75 });
});

/* ═══════════════ 3 柳下请酒 ═══════════════ */
vk.scene('柳下请酒', 10.6, { vo: [
  { text: '众泼皮爬起来，倒头便拜。次日买了酒肉，请他在垂杨柳下吃酒。', at: .5 },
] }, sc => {
  const W = WJ.world(sc, { mood: 'dusk', ground: GY, farTop: 330, midTop: 470, midAmp: 64, seed: 6.1,
    mist: [{ y: 468, h: 52, op: .42 }], grass: grassRow([60, 210, 1150, 1240], GY, { h: 26 }) });
  W.props.insertAdjacentHTML('beforeend', CY.wall(-40, 1320, 396, 118));
  W.props.insertAdjacentHTML('beforeend', CY.beds([{ y: 548, x0: 940, x1: 1260, n: 4, s: .8 }]));
  W.props.insertAdjacentHTML('beforeend', CY.stone(700, GY, 150, 48));
  W.props.insertAdjacentHTML('beforeend', CY.jar(700, GY - 44, .9));
  W.props.insertAdjacentHTML('beforeend', CY.tray(560, GY - 2, 1));
  vk.bake(W.props, { scale: 1 });
  const willow = CY.willow(sc, W.actors, { x: 360, y: GY, scale: 1, seed: 5 });
  willow.nestG.insertAdjacentHTML('beforeend', CY.nest(38, -246, 1));
  const lz = LZR.luzhishen(W.actors);
  const DRINK = 3.4;
  const act = lz.play([{ at: 0, clip: 'idle' }, { at: DRINK, clip: 'drink', local: true, blend: .4 }, { at: 9.4, clip: 'laugh', blend: .4 }]);
  const pxs = [PXR.poxi(W.actors, PXR.PALETTES[0]), PXR.poxi(W.actors, PXR.PALETTES[2]), PXR.poxi(W.actors, PXR.PALETTES[3])];
  const pacts = [
    pxs[0].play([{ at: 0, clip: 'kneel', speed: .9 }, { at: 2.6, clip: 'offer', blend: .5 }]),
    pxs[1].play([{ at: 0, clip: 'kneel', speed: .9, offset: .5 }, { at: 3.1, clip: 'idle', blend: .5 }, { at: 6.0, clip: 'cheer', blend: .4 }]),
    pxs[2].play([{ at: 0, clip: 'carry', speed: .8 }, { at: 3.6, clip: 'offer', blend: .45 }]),
  ];
  sc.on(l => {
    willow.update(l, { wind: .24 + .12 * Math.sin(l * .62) });
    lz.render(l, act, { x: 872, y: lzY(GY), scale: LZ_S, flip: -1 }, { staff: 0, bowl: l > DRINK - .2 ? 1 : 0, wind: .3,
      face: l > 9.4 ? 'shout' : null });
    const carryX = Kl(l, [[0, 250], [3.4, 600], [10.6, 600]]);
    pxs[0].render(l, pacts[0], { x: 660, y: pxY(GY), scale: PX_S, flip: 1 }, { blinkOffset: .3 });
    pxs[1].render(l, pacts[1], { x: 500, y: pxY(GY), scale: PX_S * .96, flip: 1 }, { blinkOffset: 1.1, face: l > 6.0 ? 'shout' : null });
    pxs[2].render(l, pacts[2], { x: carryX, y: pxY(GY), scale: PX_S * .92, flip: 1 }, { jar: l < 3.9 ? 1 : 0, blinkOffset: .7 });
  });
  WS.luogu(sc, .2, 'tai', { gain: .6 });
  for (let i = 0; i < 4; i++) sc.sfx(DRINK + .4 + i * 1.7, 'thud', .18, 120);
  WS.stroke(sc, 6.1, 'tai', .5);
  sc.sfx(8.6, 'caw', .3);
});

/* ═══════════════ 4 老鸦聒噪 ═══════════════ */
vk.scene('老鸦聒噪', 11.2, { vo: [
  { text: '正吃得快活，那树上的老鸦，叫个不住。', at: .4 },
  { text: '众泼皮道：我们搬梯子去，拆了那老鸦巢！', at: 5.0 },
] }, sc => {
  const W = WJ.world(sc, { mood: 'dusk', ground: GY, farTop: 330, midTop: 470, midAmp: 64, seed: 6.1,
    mist: [{ y: 468, h: 52, op: .42 }], gust: l => .3 * sm((l - 1.2) / 1.2), windLines: 3,
    grass: grassRow([60, 210, 1150, 1240], GY, { h: 26 }) });
  W.props.insertAdjacentHTML('beforeend', CY.wall(-40, 1320, 396, 118));
  const willow = CY.willow(sc, W.props, { x: 360, y: GY, scale: 1, seed: 5 });
  willow.nestG.insertAdjacentHTML('beforeend', CY.nest(38, -246, 1));
  W.props.insertAdjacentHTML('beforeend', CY.stone(700, GY, 150, 48));
  W.props.insertAdjacentHTML('beforeend', CY.jar(700, GY - 44, .9));
  const crows = [CY.crow(W.fx, { scale: .62 }), CY.crow(W.fx, { scale: .52 }), CY.crow(W.fx, { scale: .46 })];
  const lz = LZR.luzhishen(W.actors);
  const act = lz.play([{ at: 0, clip: 'drink', local: true }, { at: 1.6, clip: 'look', blend: .45 }, { at: 7.2, clip: 'idle', blend: .5 }]);
  const pxs = [PXR.poxi(W.actors, PXR.PALETTES[0]), PXR.poxi(W.actors, PXR.PALETTES[2])];
  const pacts = [
    pxs[0].play([{ at: 0, clip: 'idle' }, { at: 2.0, clip: 'point', blend: .4 }, { at: 6.4, clip: 'walk', speed: .9, blend: .35 }]),
    pxs[1].play([{ at: 0, clip: 'idle', offset: 1.3 }, { at: 2.4, clip: 'point', blend: .4 }, { at: 6.0, clip: 'carry', speed: .9, blend: .35 }]),
  ];
  const ladder = CY.add(W.props, `<g opacity="0">${CY.ladder(0, 0, { h: 210, w: 44, rot: -18 })}</g>`);
  sc.on(l => {
    const wind = .3 + .2 * sm((l - 1.2) / 1.4);
    willow.update(l, { wind, shake: .12 * bump(l, 1.6, 3.4, .5) });
    // three crows circling the crown, wings beating (positions are pure functions of l)
    crows.forEach((c, i) => {
      const ph = l * (1.05 + i * .18) + i * 2.1, r = 118 + i * 34;
      const cx = 372 + Math.cos(ph) * r * 1.5, cy = 250 + i * 26 + Math.sin(ph * 1.3) * 34;
      c.set({ x: cx, y: cy, flap: .5 + .5 * Math.sin(l * 13 + i * 2), flip: Math.cos(ph) < 0 ? 1 : -1, rot: Math.sin(ph * 1.3) * 9, scale: .62 - i * .08 });
    });
    lz.render(l, act, { x: 872, y: lzY(GY), scale: LZ_S, flip: -1 }, { staff: 0, bowl: l < 1.9 ? 1 : 0, wind: .3 });
    const w0 = Kl(l, [[6.4, 980], [11.2, 1240]]);
    pxs[0].render(l, pacts[0], { x: l < 6.4 ? 980 : w0, y: pxY(GY), scale: PX_S, flip: l < 6.4 ? -1 : 1 }, { blinkOffset: .3, face: l > 5.0 && l < 7.2 ? 'shout' : null });
    pxs[1].render(l, pacts[1], { x: Kl(l, [[0, 1100], [6.0, 1100], [11.2, 1276]]), y: pxY(GY), scale: PX_S * .95, flip: l < 6.0 ? -1 : 1 }, { blinkOffset: 1.2 });
    const lop = clamp((l - 6.9) / .5) * (1 - clamp((l - 10.8) / .4));
    WS.setOp(ladder, lop);
    vk.attr(ladder, { transform: `translate(${R(Kl(l, [[6.9, 1230], [11.2, 1020]]))} ${GY - 10})` });
  });
  [.6, 1.5, 2.6, 3.6, 8.6].forEach((t, i) => sc.sfx(t, 'caw', i < 4 ? .62 : .4));
  WS.stroke(sc, 2.0, 'tai', .6); WS.stroke(sc, 5.1, 'da', .6);
  sc.sfx(1.3, 'wind', .3, 3);
  CY.card(sc, '拆了那巢', '泼皮道：搬梯子来！', { at: 5.3, out: 8.8, x: 992, y: 92, seal: '聒噪' });
});

/* ═══════════════ 5 倒拔垂杨柳 ═══════════════ */
vk.scene('倒拔垂杨柳', 21.0, { vo: [
  { who: 'lu', text: '不必费事！看洒家把这株绿杨树，连根拔起！', at: .5 },
  { text: '智深相了一相，走到树前，右手向下，把身倒缴着，左手拔住上截——', at: 6.2 },
  { text: '只一趁，便把那株绿杨树，带根拔起！', at: 14.9 },
] }, sc => {
  const W = WJ.world(sc, { mood: 'dusk', ground: GY, farTop: 330, midTop: 470, midAmp: 64, seed: 6.1,
    mist: [{ y: 468, h: 52, op: .42 }], gust: l => .45 * bump(l, 15.4, 18.8, .6), windLines: 4,
    grass: grassRow([60, 210, 1150, 1240], GY, { h: 26 }) });
  W.props.insertAdjacentHTML('beforeend', CY.wall(-40, 1320, 396, 118));
  // the hole left behind (drawn before the tree so the root ball rises out of it)
  W.props.insertAdjacentHTML('beforeend', CY.stone(760, GY, 150, 48));
  W.props.insertAdjacentHTML('beforeend', CY.jar(760, GY - 44, .9));
  const hole = CY.add(W.props, `<g opacity="0">${CY.pit(470, GY + 6, 190, { h: 44, planks: false })}</g>`);
  const willow = CY.willow(sc, W.props, { x: 470, y: GY, scale: 1, seed: 5 });
  willow.nestG.insertAdjacentHTML('beforeend', CY.nest(38, -246, 1));
  const staffProp = CY.add(W.props, `<g opacity="0" filter="url(#pc-shadow)"><g transform="translate(902 ${GY}) rotate(6) scale(.62)">
    ${WS.P('M-6 -126 L6 -126 L7 176 L-7 176 Z', '#8a5a2c', { step: 8, amp: .5 })}
    ${WS.P('M-30 -128 C-35 -164 -13 -182 0 -170 C13 -182 35 -164 30 -128 C23 -148 11 -156 0 -147 C-11 -156 -23 -148 -30 -128 Z', '#aab4ba', { step: 6, amp: .7 })}
    ${WS.P(WS.E(-16, -122, 6.5, 6.5) + ' ' + WS.E(16, -122, 6.5, 6.5), '#cfa13c', { amp: .3 })}</g></g>`);
  const lz = LZR.luzhishen(W.actors);
  const pxs = [PXR.poxi(W.actors, PXR.PALETTES[0]), PXR.poxi(W.actors, PXR.PALETTES[2])];

  // ---- beats ----
  const PLANT = 5.4, ARRIVE = 7.4, SIZE = 7.6, GRIP = 11.0, HEAVE = 15.5, OUT = 16.8, SWING = 17.8, HOLD = 19.1;
  const TX = 470;                                       // trunk x
  // the tree's state is a pure function of l — the willow, the hole and the monk's hand IK all read the same
  // function, so the result never depends on which sc.on() ran first.
  const treeState = l => ({
    lift: Kl(l, [[HEAVE, 0], [OUT, 64], [SWING, 140], [HOLD, 206], [21.0, 204]]),
    tilt: Kl(l, [[HEAVE, 0], [OUT, 9], [SWING, 28], [HOLD, 52], [21.0, 52]]),
    dx: Kl(l, [[OUT, 0], [SWING, -14], [HOLD, -34], [21.0, -36]]),
    wind: .26 + .16 * Math.sin(l * .6) + .45 * bump(l, HEAVE, SWING, .5),
    shake: .8 * bump(l, GRIP + .4, HEAVE, .35) * (.35 + .65 * clamp((l - GRIP - .4) / (HEAVE - GRIP))) + .55 * bump(l, HEAVE, OUT, .3),
    roots: clamp((Kl(l, [[HEAVE, 0], [OUT, 64], [SWING, 140], [HOLD, 206], [21.0, 204]]) - 10) / 34),
  });
  const gripHi = l => willow.pointAt([36, -148], treeState(l));   // 左手拔住上截
  const gripLo = l => willow.pointAt([32, -80], treeState(l));    // 右手向下
  const wx = l => Kl(l, [[0, 880], [ARRIVE, 574], [GRIP - .4, 556], [21.0, 556]]);
  const act = lz.play([
    { at: 0, clip: 'point', blend: .2 }, { at: 3.2, clip: 'laugh', blend: .45 }, { at: 5.1, clip: 'walk', speed: .85, blend: .35 },
    { at: SIZE, clip: 'size', blend: .45 }, { at: GRIP - .5, clip: 'grip', blend: .5 },
    { at: HEAVE, clip: 'heave', local: true, blend: .12 }, { at: OUT, clip: 'hold', blend: .4 }, { at: HOLD + .4, clip: 'victory', blend: .6 },
  ], {
    ik: { armF: l => (l > GRIP - .4 && l < OUT + .5 ? gripHi(l) : null), armN: l => (l > GRIP - .4 && l < OUT + .5 ? gripLo(l) : null) },
    ikWeight: { armF: l => sm((l - GRIP + .4) / .45) * (1 - sm((l - OUT) / .45)), armN: l => sm((l - GRIP + .4) / .45) * (1 - sm((l - OUT) / .45)) },
  });
  const pacts = [
    pxs[0].play([{ at: 0, clip: 'idle' }, { at: 1.4, clip: 'awe', blend: .4 }, { at: OUT, clip: 'cheer', blend: .3 }]),
    pxs[1].play([{ at: 0, clip: 'idle', offset: 1.1 }, { at: 1.9, clip: 'awe', blend: .4 }, { at: OUT + .2, clip: 'cheer', blend: .3 }]),
  ];
  sc.on(l => {
    const st = treeState(l);
    willow.update(l, st);
    WS.setOp(hole, clamp((st.lift - 10) / 40) * .95);
    WS.setOp(staffProp, clamp((l - PLANT) / .25));
    lz.render(l, act, { x: wx(l), y: lzY(GY), scale: LZ_S, flip: -1 }, {
      staff: l < PLANT ? 1 : 0, wind: .35,
      face: (l > .5 && l < 5.4) || (l > HEAVE - .3 && l < OUT + .8) ? 'shout' : null,
    });
    pxs[0].render(l, pacts[0], { x: 1060, y: pxY(GY), scale: PX_S, flip: -1 }, { blinkOffset: .4, face: l > OUT ? 'shout' : null });
    pxs[1].render(l, pacts[1], { x: 1190, y: pxY(GY), scale: PX_S * .95, flip: -1 }, { blinkOffset: 1.2, face: l > OUT + .2 ? 'shout' : null });
  });
  // 泥土与碎根飞溅 at the moment the root ball tears out of the ground
  sc.gl([CY.soilBurst({ t: HEAVE + .35, n: 46, x: TX, y: GY - 4, seed: 12, spread: 200, speed: [220, 780] }),
    CY.dust({ t: HEAVE + .4, n: 22, x: TX, y: GY - 10, seed: 6 })], { zIndex: 8 });
  WJ.bigChar(sc, '拔', HEAVE + .1, { x: 120, y: 92, size: 168, out: HEAVE + 1.6 });
  // sound: quiet while he sizes it up, 急急风 under the strain, 大锣 on the tear-out, 四击头 on the 亮相
  WS.stroke(sc, .5, 'da', .7); WS.luogu(sc, 3.2, 'hit', { gain: .7 });
  [5.6, 6.4, 7.1].forEach(t => WS.stroke(sc, t, 'tai', .4));
  sc.sfx(PLANT + .05, 'thud', .5);
  WS.jijifeng(sc, GRIP + .2, Math.round((HEAVE - GRIP - .2) / (60 / 190)), { bpm: 190, gain: .5 });
  sc.sfx(HEAVE - .1, 'wind', .4, 2);
  sc.sfx(HEAVE + .3, 'crack', 1.0); WS.stroke(sc, HEAVE + .32, 'cang', 1); sc.shake(HEAVE + .3, 18, .7);
  sc.sfx(HEAVE + .45, 'thud', .8); sc.shake(OUT, 8, .5);
  sc.sfx(SWING - .1, 'swish', .9);
  WS.luogu(sc, HOLD + .5, 'sijitou', { gain: 1 });
  [.4, 1.4, 2.4].forEach((t, i) => sc.sfx(HEAVE + 1.6 + t, 'caw', .5 - i * .1));
});

/* ═══════════════ 6 众泼皮拜倒 ═══════════════ */
vk.scene('拜倒', 9.8, { vo: [
  { text: '众泼皮见了，尽皆拜倒在地，都道：师父非是凡人，正是真罗汉的身体！', at: .6 },
] }, sc => {
  const W = WJ.world(sc, { mood: 'dusk', sun: { x: 1040, y: 226, r: 52, color: '#c9442e' }, ground: GY, farTop: 330, midTop: 470, midAmp: 64, seed: 7.7,
    mist: [{ y: 468, h: 52, op: .44 }], grass: grassRow([60, 210, 1150, 1240], GY, { h: 26 }) });
  W.props.insertAdjacentHTML('beforeend', CY.wall(-40, 1320, 396, 118));
  W.props.insertAdjacentHTML('beforeend', CY.pit(664, GY + 2, 180, { h: 42, planks: false }));
  // the uprooted willow now lies across the garden, its root ball beside the hole it came out of
  const willow = CY.willow(sc, W.props, { x: 610, y: GY - 26, scale: .92, seed: 5 });
  willow.nestG.insertAdjacentHTML('beforeend', CY.nest(38, -246, 1));
  const lz = LZR.luzhishen(W.actors);
  const act = lz.play([{ at: 0, clip: 'pant' }, { at: 1.6, clip: 'victory', blend: .45 }, { at: 6.8, clip: 'laugh', blend: .45 }]);
  const pxs = [0, 1, 2].map(i => PXR.poxi(W.actors, PXR.PALETTES[i]));
  const pacts = pxs.map((p, i) => p.play([{ at: 0, clip: 'awe', offset: i * .5 }, { at: .8 + i * .25, clip: 'kneel', speed: .95, blend: .35 }]));
  sc.on(l => {
    willow.update(l, { wind: .26 + .1 * Math.sin(l * .7), tilt: -78, scale: .92, roots: 1 });
    lz.render(l, act, { x: 790, y: lzY(GY), scale: LZ_S, flip: -1 }, { staff: 0, wind: .35, face: l > 6.8 ? 'shout' : null });
    pxs.forEach((p, i) => p.render(l, pacts[i], { x: 962 + i * 116, y: pxY(GY), scale: PX_S * (1 - i * .03), flip: -1 }, { blinkOffset: i * .7 }));
  });
  WS.luogu(sc, 1.6, 'sijitou', { gain: .95 });
  [1.9, 2.7, 3.6].forEach((t, i) => { sc.sfx(t, 'thud', .3, 90); WS.stroke(sc, t, 'da', .4 - i * .05); });
  CY.card(sc, '真罗汉', '师父非是凡人', { at: 4.8, out: 9.0, x: 116, y: 96, seal: '拜服' });
  sc.sfx(5.6, 'caw', .3);
});

/* ═══════════════ 7 尾板 ═══════════════ */
vk.scene('尾板', 8.6, { vo: [
  { text: '这便是《水浒传》里，花和尚鲁智深，倒拔垂杨柳。', at: 1.4 },
] }, sc => {
  const gy = x => 600 - 30 * Math.exp(-Math.pow((x - 900) / 420, 2));
  const W = WJ.world(sc, { mood: 'night', moon: { x: 300, y: 140, r: 42 }, ground: gy, farTop: 330, midTop: 466, midAmp: 78, seed: 2.7,
    mist: [{ y: 470, h: 56, op: .48 }, { y: 552, h: 42, op: .3 }],
    pines: [{ x: 120, y: 500, h: 150, seed: 15, op: .5 }], grass: grassRow([60, 190, 320, 1210], gy, { h: 26 }) });
  const lz = LZR.luzhishen(W.actors);
  const act = lz.play([{ at: 0, clip: 'walk', speed: .78 }]);
  // he shoulders the willow and walks off — the tree rides on his shoulder
  const willow = CY.willow(sc, W.props, { x: 0, y: 0, scale: .72, seed: 5 });
  willow.nestG.insertAdjacentHTML('beforeend', CY.nest(38, -246, 1));
  sc.on(l => {
    const x = 300 + l * 52, y = gy(x);
    lz.render(l, act, { x, y: y - LZR.SOLE * .46, scale: .46, flip: 1 }, { staff: 0, wind: .3 });
    const root = { x, y: y - LZR.SOLE * .46, scale: .46, flip: 1 };
    const sh = lz.point('chest', -16, -128, l, act, root, {});      // the shoulder the trunk rests on
    willow.update(l, { wind: .34, tilt: -100, dx: sh[0], lift: -sh[1], scale: .72, roots: 1 });
  });
  sc.add(vk.endcard({ big: '花和尚 鲁智深', small: '倒拔垂杨柳　终', seal: '相国寺', size: 66, at: 2.6, out: 8.4, pos: { x: 1046, y: 72 } }));
  sc.add(vk.credits(['故事：施耐庵《水浒传》第七回', '剪纸动画：vidkit 逐帧生成', '旁白 · 京剧锣鼓：代码合成'], { at: 5.2, pos: { x: 940, y: 566 }, size: 16 }));
  WS.luogu(sc, .2, 'tai', { gain: .55 });
  WS.luogu(sc, 2.6, 'sijitou', { gain: .85 });
  sc.sfx(4.4, 'wind', .3, 4);
});
</script>
