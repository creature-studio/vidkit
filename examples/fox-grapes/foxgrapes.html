<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>狐狸与葡萄 · 绘本动画短片（vidkit）</title>
</head>
<body>
<script src="../../dist/vidkit.js"></script>
<script src="lib/storybook.js"></script>
<script src="lib/fox-rig.js"></script>
<script>
// 《狐狸与葡萄》— 伊索寓言。现代绘本手绘风：米色纸底 + 蜡笔毛边 + 柔和色块（lib/storybook.js），
// 狐狸是骨骼角色（lib/fox-rig.js），配乐与音效全部代码合成，旁白 + 狐狸两个声音。
// 一切都是场景本地时间 t 的纯函数：seek 到任意时刻画面完全一致。

/* ---------------- 主题：绘本 ---------------- */
vk.register('themes', 'storybook', {
  label: '绘本（米色纸、蜡笔、暖橘）',
  modes: {
    light: { bg: '#FBF4E6', fg: '#4A3A32', muted: '#8A7466', surface: '#FFFDF6', line: '#E0CDB2', accent: '#E2803C', accent2: '#7C5AA8', onAccent: '#FFFDF6' },
    dark: { bg: '#4A3A32', fg: '#FBF4E6', muted: '#C9B49F', surface: '#5C483D', line: '#7A6354', accent: '#F09A55', accent2: '#A98BD0', onAccent: '#4A3A32' },
    accent: { bg: '#E2803C', fg: '#FFFDF6', muted: '#FBE0C6', surface: '#4A3A32', line: '#F3B27C', accent: '#4A3A32', accent2: '#FFFDF6', onAccent: '#FFFDF6' },
  },
  mode: 'light', warn: '#D8593C', ok: '#6FA24B', yellow: '#F7C65B',
  chart: ['#E2803C', '#7C5AA8', '#6FA24B', '#F7C65B', '#8FC7E8', '#8A7466'],
  fonts: { sans: '"Noto Sans SC","PingFang SC",system-ui,sans-serif', display: '"Noto Sans SC","PingFang SC",system-ui,sans-serif', mono: '"JetBrains Mono",monospace', serif: '"Noto Sans SC",serif' },
  weight: { display: 900, title: 800, sub: 700 },
  tracking: { display: '.02em', title: '.01em' },
  scale: { hero: 240, h1: 80, h2: 56, h3: 34, body: 27, small: 22, label: 21, caption: 30 },
  radius: 18, ease: 'smooth', cascade: .4,
  marker: 'rgba(226,128,60,.35)', caret: '#E2803C',
  caption: { bg: 'rgba(255,253,246,.94)', fg: '#4A3A32', karaoke: '#E2803C' },
});

const v = vk.video({
  format: '16:9', fps: 30, theme: 'storybook', title: '狐狸与葡萄', transition: 'fade:.7',
  voice: {
    manifest: 'foxgrapes.vo.json', voice: 'zh-CN-XiaoxiaoNeural', rate: '-2%', pitch: '+0Hz',
    lead: .35, tail: .55, gap: .25, maxChars: 17,
    cast: { fox: { voice: 'zh-CN-YunxiNeural', rate: '+4%', pitch: '+4Hz' } },
  },
  karaoke: 'sweep',
  mix: { lufs: -14, duck: -9 },
  scoreOptions: { pad: [130.81, 196, 261.63], padGain: .009 },
});

SB.defs(v);   // 蜡笔/纸纹滤镜与渐变：整片共用一份

/* ---------------- 小工具 ---------------- */
const { sm, clamp, COL } = SB;
const R = n => Math.round(n * 10) / 10;
const K = (t, keys) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [t1, v1] = keys[i]; if (t <= t1) { const [t0, v0] = keys[i - 1]; return v0 + (v1 - v0) * sm((t - t0) / (t1 - t0 || 1)); } } return keys[keys.length - 1][1]; };
const Kl = (t, keys) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [t1, v1] = keys[i]; if (t <= t1) { const [t0, v0] = keys[i - 1]; return v0 + (v1 - v0) * clamp((t - t0) / (t1 - t0 || 1)); } } return keys[keys.length - 1][1]; };
const bump = (t, a, b, e = .25) => sm((t - a) / e) * (1 - sm((t - b) / e));
// 抛物线跳跃：t0 起跳、t1 落地、h 最高点
const arc = (t, t0, t1, h) => { const u = (t - t0) / (t1 - t0); return u <= 0 || u >= 1 ? 0 : 4 * h * u * (1 - u); };

const FOX_S = 1.0;                       // 狐狸整体缩放
const ARBOR = { x: 940, w: 356, h: 404 };   // 葡萄架（高到狐狸怎么跳都差一点）
const UNDER = 826;                          // 狐狸起跳的位置：正在最左那串葡萄下面

/* ---------------- 音效：脚步与"够不到"的小滑音 ---------------- */
// 软软的脚步（纸面上的小鼓点）
vk.register('sounds', 'step', (k, t, gain = 1) => { k.tone(t, 'sine', 210, 90, .09, .22 * gain); k.noise(t, .04, 'bandpass', 900, 1.4, .1 * gain); });
// 失望的下滑音（"哎——"）
vk.register('sounds', 'wahwah', (k, t, gain = 1, f) => {
  const f0 = f || 520;
  k.tone(t, 'triangle', f0, f0 * .55, .42, .16 * gain);
  k.tone(t + .04, 'sine', f0 * .5, f0 * .3, .46, .1 * gain);
});
// 布料/草叶擦过
vk.register('sounds', 'brush', (k, t, gain = 1) => k.noise(t, .18, 'highpass', 2600, .9, .13 * gain));

/* ============================================================ 0 · 片头 ============================================================ */
vk.scene('片头', 9.0, { transition: 'fade:.8', vo: [{ text: '伊索寓言里，有一只狐狸，和一串怎么也够不到的葡萄。', at: 2.0 }] }, sc => {
  const W = SB.world(sc, { seed: 1.7, clouds: 3, sun: [1084, 120], tufts: 8 });
  W.props.insertAdjacentHTML('beforeend', SB.arbor({ x: ARBOR.x, y: W.gy(ARBOR.x), w: ARBOR.w, h: ARBOR.h, seed: 4 }));
  const top = W.gy(ARBOR.x) - ARBOR.h;
  const bunches = [
    SB.bunchG(W.props, { x: ARBOR.x - 96, y: top + 34, s: .95, seed: 11 }),
    SB.bunchG(W.props, { x: ARBOR.x + 18, y: top + 26, s: 1.08, seed: 12 }),
    SB.bunchG(W.props, { x: ARBOR.x + 116, y: top + 38, s: .88, seed: 13 }),
  ];
  const fox = FOX.fox(W.actors, { blinkOffset: .4 });
  const act = fox.play([{ at: 0, clip: 'walk', speed: .9 }, { at: 6.2, clip: 'idle', blend: .5 }]);
  SB.butterfly(sc, W.fx, { scale: 1, phase: .3, path: l => [180 + l * 46, 372 + Math.sin(l * 1.9) * 34] });

  sc.on(l => {
    bunches.forEach((b, i) => b.update(l, { swing: Math.sin(l * 1.3 + i * 2.1) * 1.8 }));
    const x = Kl(l, [[0, 150], [6.2, 470], [9.0, 470]]);
    fox.render(l, act, { x, y: W.gy(x), scale: FOX_S, flip: 1 }, { eye: l > 6.4 ? 'squint' : 'open' });
  });

  // 片名
  sc.add(
    vk.title('狐狸与葡萄', { at: 1.0, fx: 'letters', each: .07, size: 88, color: COL.ink, weight: 900, out: 6.9, outFx: 'fade', fixed: true, pos: { x: 470, y: 128, anchor: 'center' } }),
    vk.text('伊索寓言 · 绘本动画', { at: 1.9, fx: 'up', size: 28, color: '#8A7466', out: 6.9, outFx: 'fade', fixed: true, pos: { x: 470, y: 198, anchor: 'center' } }),
  );

  [.5, 1.1, 1.7, 2.3, 2.9, 3.5, 4.1, 4.7, 5.3].forEach(t => sc.sfx(t, 'step', .5));
  sc.sfx(.9, 'pluck', .5, 261.63); sc.sfx(1.5, 'pluck', .45, 329.63); sc.sfx(2.1, 'pluck', .4, 392);
});

/* ============================================================ 1 · 又热又渴 ============================================================ */
vk.scene('又热又渴', 13.4, { vo: [
  { text: '夏天的午后，一只狐狸走在路上，又热又渴。忽然他抬起头——葡萄架上，挂着一串串紫得发亮的葡萄。', at: .5 },
] }, sc => {
  const W = SB.world(sc, { seed: 1.7, clouds: 3, sun: [1084, 120], tufts: 8 });
  W.props.insertAdjacentHTML('beforeend', SB.arbor({ x: ARBOR.x, y: W.gy(ARBOR.x), w: ARBOR.w, h: ARBOR.h, seed: 4 }));
  const top = W.gy(ARBOR.x) - ARBOR.h;
  const bunches = [
    SB.bunchG(W.props, { x: ARBOR.x - 96, y: top + 34, s: .95, seed: 11 }),
    SB.bunchG(W.props, { x: ARBOR.x + 18, y: top + 26, s: 1.08, seed: 12 }),
    SB.bunchG(W.props, { x: ARBOR.x + 116, y: top + 38, s: .88, seed: 13 }),
  ];
  const LOOK = 7.4;                       // 抬头看见葡萄
  const fox = FOX.fox(W.actors, { blinkOffset: .9 });
  const act = fox.play([{ at: 0, clip: 'thirsty' }, { at: LOOK, clip: 'lookUp', blend: .45 }]);
  const fxG = W.fx;
  const sweat = document.createElementNS('http://www.w3.org/2000/svg', 'g'); fxG.appendChild(sweat);

  sc.on(l => {
    bunches.forEach((b, i) => b.update(l, { swing: Math.sin(l * 1.3 + i * 2.1) * 1.8 }));
    const x = Kl(l, [[0, 150], [LOOK - .4, 712], [13.4, 712]]);
    const st = { eye: l > LOOK + .3 ? 'wide' : (l > 2 && l < LOOK ? 'squint' : 'open'), tongue: l < LOOK ? 1 : 0 };
    fox.render(l, act, { x, y: W.gy(x), scale: FOX_S, flip: 1 }, st);
    // 汗珠：走热了甩两滴
    const hx = x + 66, hy = W.gy(x) - 112;
    sweat.innerHTML = (l < LOOK ? SB.sweat(hx, hy, ((l * .9) % 1), 1) + SB.sweat(hx, hy, ((l * .9 + .45) % 1), -1) : '');
  });

  // 看见葡萄的一刻：长笛 + 铃
  sc.sfx(LOOK + .1, 'flute', .5, 659.25);
  sc.sfx(LOOK + .5, 'chime', .4, 880);
  [.6, 1.5, 2.4, 3.3, 4.2, 5.1, 6.0, 6.9].forEach(t => sc.sfx(t, 'step', .42));
});

/* ============================================================ 2 · 第一跳 ============================================================ */
vk.scene('第一跳', 10.4, { vo: [
  { who: 'fox', text: '这串葡萄，看着就甜。', at: .4 },
  { text: '他后腿一蹬，跳了起来——差了一大截。', at: 3.4 },
] }, sc => {
  const W = SB.world(sc, { seed: 1.7, clouds: 3, sun: [1084, 120], tufts: 8 });
  W.props.insertAdjacentHTML('beforeend', SB.arbor({ x: ARBOR.x, y: W.gy(ARBOR.x), w: ARBOR.w, h: ARBOR.h, seed: 4 }));
  const top = W.gy(ARBOR.x) - ARBOR.h;
  const bunches = [
    SB.bunchG(W.props, { x: ARBOR.x - 96, y: top + 34, s: .95, seed: 11 }),
    SB.bunchG(W.props, { x: ARBOR.x + 18, y: top + 26, s: 1.08, seed: 12 }),
    SB.bunchG(W.props, { x: ARBOR.x + 116, y: top + 38, s: .88, seed: 13 }),
  ];
  const JUMP = 5.0, LAND = 6.15, FX = UNDER;        // 起跳 / 落地 / 站位
  const fox = FOX.fox(W.actors, { blinkOffset: .2 });
  const act = fox.play([
    { at: 0, clip: 'talk' }, { at: 2.6, clip: 'lookUp', blend: .4 },
    { at: JUMP - .55, clip: 'crouch', blend: .3 },
    { at: JUMP, clip: 'leap', local: true, blend: .14 },
    { at: JUMP + .42, clip: 'fall', blend: .18 },
    { at: LAND, clip: 'land', local: true, blend: .12 },
    { at: LAND + .7, clip: 'idle', blend: .4 },
    { at: 8.4, clip: 'lookUp', blend: .45 },
  ]);
  const puff = SB.puff(W.fx, { seed: 3 });

  sc.on(l => {
    bunches.forEach((b, i) => b.update(l, { swing: Math.sin(l * 1.3 + i * 2.1) * 1.8 }));
    const y = W.gy(FX) - arc(l, JUMP, LAND, 74);
    fox.render(l, act, { x: FX, y, scale: FOX_S, flip: 1 },
      { mouth: l < 2.4 ? undefined : (l > JUMP && l < LAND ? .55 : .1), eye: l > JUMP && l < LAND + .2 ? 'wide' : (l > 6.6 ? 'squint' : 'open') });
    puff.update(clamp((l - LAND) / .55), FX - 10, W.gy(FX) + 6, 1);
  });

  sc.sfx(JUMP - .5, 'brush', .5);
  sc.sfx(JUMP, 'whoosh', .5);
  sc.sfx(LAND, 'drop', .55, 420);
  sc.sfx(LAND + .05, 'kick', .35);
  sc.sfx(LAND + .35, 'wahwah', .8, 520);
  sc.sfx(1.0, 'pluck', .4, 329.63);
});

/* ============================================================ 3 · 助跑再跳 ============================================================ */
vk.scene('再来一次', 11.9, { vo: [
  { who: 'fox', text: '再来一次！', at: .3 },
  { text: '他退后几步，助跑，起跳。爪子擦过叶子，还是够不着。', at: 2.0 },
] }, sc => {
  const W = SB.world(sc, { seed: 1.7, clouds: 3, sun: [1084, 120], tufts: 8 });
  W.props.insertAdjacentHTML('beforeend', SB.arbor({ x: ARBOR.x, y: W.gy(ARBOR.x), w: ARBOR.w, h: ARBOR.h, seed: 4 }));
  const top = W.gy(ARBOR.x) - ARBOR.h;
  const bunches = [
    SB.bunchG(W.props, { x: ARBOR.x - 96, y: top + 34, s: .95, seed: 11 }),
    SB.bunchG(W.props, { x: ARBOR.x + 18, y: top + 26, s: 1.08, seed: 12 }),
    SB.bunchG(W.props, { x: ARBOR.x + 116, y: top + 38, s: .88, seed: 13 }),
  ];
  const BACK = 1.4, RUN = 3.6, JUMP = 5.3, TOP = 5.85, LAND = 6.6;
  const fox = FOX.fox(W.actors, { blinkOffset: 1.5 });
  const act = fox.play([
    { at: 0, clip: 'talk' },
    { at: BACK, clip: 'walk', speed: -1.1, blend: .35 },
    { at: RUN, clip: 'walk', speed: 2.4, blend: .3 },
    { at: JUMP - .3, clip: 'crouch', blend: .2 },
    { at: JUMP, clip: 'leap', local: true, blend: .12 },
    { at: TOP, clip: 'fall', blend: .18 },
    { at: LAND, clip: 'land', local: true, blend: .12 },
    { at: LAND + .8, clip: 'lookUp', blend: .45 },
  ]);
  const puff = SB.puff(W.fx, { seed: 5 });
  const lines = document.createElementNS('http://www.w3.org/2000/svg', 'g'); W.fx.appendChild(lines);

  sc.on(l => {
    // 爪子在最高点擦过叶子 → 那一串晃
    const brushU = bump(l, TOP - .12, TOP + .5, .12);
    bunches.forEach((b, i) => b.update(l, { swing: Math.sin(l * 1.3 + i * 2.1) * 1.8 + (i === 0 ? Math.sin((l - TOP) * 26) * 9 * brushU : 0) }));
    const x = Kl(l, [[0, UNDER], [BACK, UNDER], [RUN, 632], [JUMP, 818], [LAND, 866], [11.9, 866]]);
    const y = W.gy(x) - arc(l, JUMP, LAND, 104);
    fox.render(l, act, { x, y, scale: FOX_S, flip: 1 },
      { eye: l > JUMP && l < LAND ? 'wide' : (l > LAND + .2 && l < LAND + 1.4 ? 'squint' : 'open'), brow: l > RUN && l < LAND ? 1 : 0, mouth: l > JUMP && l < LAND ? .6 : undefined });
    // 速度线
    const sp = bump(l, RUN + .2, JUMP, .2);
    lines.innerHTML = sp < .02 ? '' : [0, 1, 2].map(i =>
      SB.P(`M${R(x - 70 - i * 26)} ${R(W.gy(x) - 60 - i * 26)} L${R(x - 130 - i * 30)} ${R(W.gy(x) - 62 - i * 26)}`, 'none',
        { stroke: '#C9B49F', sw: 3, op: .55 * sp, seed: 60 + i, amp: .8, step: 12 })).join('');
    puff.update(clamp((l - LAND) / .55), x - 14, W.gy(x) + 6, 1.1);
  });

  sc.sfx(BACK + .1, 'step', .4); sc.sfx(BACK + .55, 'step', .4);
  [0, .18, .36, .54, .72].forEach((d, i) => sc.sfx(RUN + .2 + d, 'step', .5 + i * .04));
  sc.sfx(JUMP, 'whoosh', .6);
  sc.sfx(TOP, 'brush', .8);
  sc.sfx(LAND, 'drop', .6, 400);
  sc.sfx(LAND + .35, 'wahwah', .85, 470);
});

/* ============================================================ 4 · 一次，两次，三次 ============================================================ */
vk.scene('一次两次三次', 9.8, { vo: [
  { text: '一次，两次，三次……葡萄还挂在那儿，一动也不动。', at: .6 },
] }, sc => {
  const W = SB.world(sc, { seed: 1.7, clouds: 3, sun: [1084, 120], tufts: 8 });
  W.props.insertAdjacentHTML('beforeend', SB.arbor({ x: ARBOR.x, y: W.gy(ARBOR.x), w: ARBOR.w, h: ARBOR.h, seed: 4 }));
  const top = W.gy(ARBOR.x) - ARBOR.h;
  const bunches = [
    SB.bunchG(W.props, { x: ARBOR.x - 96, y: top + 34, s: .95, seed: 11 }),
    SB.bunchG(W.props, { x: ARBOR.x + 18, y: top + 26, s: 1.08, seed: 12 }),
    SB.bunchG(W.props, { x: ARBOR.x + 116, y: top + 38, s: .88, seed: 13 }),
  ];
  // 三连跳：每次更高一点，落点更狼狈一点
  // 三跳分别踩在旁白的一次 / 两次 / 三次上
  const J = [{ t: .8, h: 110, x: UNDER }, { t: 1.75, h: 120, x: UNDER + 8 }, { t: 2.7, h: 130, x: UNDER + 14 }];
  const FLOP = 4.3;                                   // 最后瘫下去
  const fox = FOX.fox(W.actors, { blinkOffset: .7 });
  const track = [{ at: 0, clip: 'crouch' }];
  J.forEach((j, i) => {
    track.push({ at: j.t, clip: 'leap', local: true, blend: .1 });
    track.push({ at: j.t + .42, clip: 'fall', blend: .16 });
    track.push({ at: j.t + .95, clip: 'land', local: true, blend: .1 });
    if (i < J.length - 1) track.push({ at: j.t + 1.35, clip: 'crouch', blend: .22 });
  });
  track.push({ at: FLOP, clip: 'pant', blend: .5 });
  const act = fox.play(track);
  const puffs = J.map((j, i) => SB.puff(W.fx, { seed: 7 + i }));
  const starG = document.createElementNS('http://www.w3.org/2000/svg', 'g'); W.fx.appendChild(starG);

  sc.on(l => {
    // 每次跳完，最近的那串轻轻晃一下（差一点点！）
    let extra = 0;
    for (const j of J) extra += Math.sin((l - (j.t + .5)) * 22) * 7 * bump(l, j.t + .42, j.t + .95, .1);
    bunches.forEach((b, i) => b.update(l, { swing: Math.sin(l * 1.3 + i * 2.1) * 1.8 + (i === 0 ? extra : 0) }));

    let x = UNDER, y = W.gy(UNDER);
    for (const j of J) { const a = arc(l, j.t, j.t + .95, j.h); if (a > 0) { x = j.x; y = W.gy(j.x) - a; } }
    if (l >= FLOP) { x = UNDER + 6; y = W.gy(UNDER + 6); }
    const tired = clamp((l - 1.0) / 3);
    fox.render(l, act, { x, y, scale: FOX_S, flip: 1 },
      { eye: l > FLOP ? 'shut' : (l > 3.7 ? 'squint' : 'wide'), brow: 1, tongue: l > 3.4 ? 1 : 0, mouth: l > FLOP ? undefined : .3 + .4 * tired });
    J.forEach((j, i) => puffs[i].update(clamp((l - (j.t + .95)) / .5), j.x - 12, W.gy(j.x) + 6, 1 + i * .12));
    starG.innerHTML = l > FLOP + .3 && l < FLOP + 2.6 ? SB.stars(UNDER + 64, W.gy(UNDER) - 96, l, 3) : '';
  });

  J.forEach((j, i) => {
    sc.sfx(j.t - .12, 'brush', .45);
    sc.sfx(j.t, 'whoosh', .5 + i * .06);
    sc.sfx(j.t + .95, 'drop', .55, 430 - i * 30);
    sc.sfx(j.t + .98, 'kick', .3);
    sc.sfx(j.t + 1.25, 'wahwah', .7, 500 - i * 40);
  });
  sc.sfx(FLOP, 'drop', .7, 240); sc.sfx(FLOP + .06, 'bass', .4, 70);
});

/* ============================================================ 5 · 喘气与借口 ============================================================ */
vk.scene('酸的', 12.7, { vo: [
  { text: '狐狸趴在地上，喘着粗气。最后，他站起来，抖了抖身上的土。', at: .4 },
  { who: 'fox', text: '哼，这葡萄根本没熟，酸得很，我才不吃呢。', at: 6.6 },
] }, sc => {
  const W = SB.world(sc, { seed: 1.7, clouds: 3, sun: [1084, 120], tufts: 8 });
  W.props.insertAdjacentHTML('beforeend', SB.arbor({ x: ARBOR.x, y: W.gy(ARBOR.x), w: ARBOR.w, h: ARBOR.h, seed: 4 }));
  const top = W.gy(ARBOR.x) - ARBOR.h;
  const bunches = [
    SB.bunchG(W.props, { x: ARBOR.x - 96, y: top + 34, s: .95, seed: 11 }),
    SB.bunchG(W.props, { x: ARBOR.x + 18, y: top + 26, s: 1.08, seed: 12 }),
    SB.bunchG(W.props, { x: ARBOR.x + 116, y: top + 38, s: .88, seed: 13 }),
  ];
  const UP = 4.6, SHAKE = 5.3, TALK = 6.5;
  const fox = FOX.fox(W.actors, { blinkOffset: .1 });
  const act = fox.play([
    { at: 0, clip: 'pant' },
    { at: UP, clip: 'idle', blend: .55 },
    { at: SHAKE, clip: 'shake', local: true, blend: .2 },
    { at: SHAKE + .9, clip: 'talk', blend: .35 },
    { at: 11.4, clip: 'idle', blend: .4 },
  ]);
  const puff = SB.puff(W.fx, { seed: 21, n: 9 });
  const FXX = UNDER + 6;

  sc.on(l => {
    bunches.forEach((b, i) => b.update(l, { swing: Math.sin(l * 1.3 + i * 2.1) * 1.8 }));
    fox.render(l, act, { x: FXX, y: W.gy(FXX), scale: FOX_S, flip: 1 }, {
      eye: l < UP ? 'shut' : (l > TALK ? 'squint' : 'open'),
      tongue: l < UP - .2 ? 1 : 0,
      brow: l > TALK ? 1 : (l < UP ? .6 : 0),
      mouth: l < UP ? undefined : (l > TALK ? undefined : .1),
    });
    puff.update(clamp((l - SHAKE) / .8), FXX - 6, W.gy(FXX) - 30, 1.2);
  });

  // "酸的"小卡片
  SB.card(sc, '酸的！', '——狐狸如是说', { at: TALK + 1.6, out: 12.0, x: 96, y: 104, w: 240, rot: -3 });
  sc.sfx(SHAKE, 'brush', .7); sc.sfx(SHAKE + .2, 'brush', .5); sc.sfx(SHAKE + .4, 'snap', .3);
  sc.sfx(TALK + 1.5, 'pop', .45);
  sc.sfx(1.2, 'pluck', .3, 196); sc.sfx(3.0, 'pluck', .28, 174.61);
});

/* ============================================================ 6 · 寓意 ============================================================ */
vk.scene('寓意', 10.2, { transition: 'fade:.7', vo: [
  { text: '说完，他昂着头走了。人们常常把得不到的东西，说成是不好的。', at: .8 },
] }, sc => {
  const W = SB.world(sc, { seed: 1.7, clouds: 3, sun: [1084, 120], tufts: 8 });
  W.props.insertAdjacentHTML('beforeend', SB.arbor({ x: ARBOR.x, y: W.gy(ARBOR.x), w: ARBOR.w, h: ARBOR.h, seed: 4 }));
  const top = W.gy(ARBOR.x) - ARBOR.h;
  const bunches = [
    SB.bunchG(W.props, { x: ARBOR.x - 96, y: top + 34, s: .95, seed: 11 }),
    SB.bunchG(W.props, { x: ARBOR.x + 18, y: top + 26, s: 1.08, seed: 12 }),
    SB.bunchG(W.props, { x: ARBOR.x + 116, y: top + 38, s: .88, seed: 13 }),
  ];
  const fox = FOX.fox(W.actors, { blinkOffset: .8 });
  const act = fox.play([{ at: 0, clip: 'strut', speed: .95 }, { at: 4.6, clip: 'strut', speed: .8, blend: .4 }]);
  SB.butterfly(sc, W.fx, { scale: .9, phase: 1.2, path: l => [980 - l * 30, 300 + Math.sin(l * 1.6) * 26] });

  sc.on(l => {
    bunches.forEach((b, i) => b.update(l, { swing: Math.sin(l * 1.3 + i * 2.1) * 1.8 }));
    const x = Kl(l, [[0, UNDER + 6], [5.4, 200], [10.2, -60]]);
    fox.render(l, act, { x, y: W.gy(x), scale: FOX_S, flip: -1 }, { eye: 'squint', brow: 0 });
  });

  // 寓意 + 尾板
  sc.add(
    vk.title('得不到的，就说它是酸的。', { at: 4.4, fx: 'words', each: .09, size: 54, weight: 800, color: COL.ink, align: 'center', out: 9.6, outFx: 'fade', fixed: true, style: 'white-space:nowrap', pos: { x: 640, y: 116, anchor: 'center' } }),
    vk.text('《伊索寓言》· 狐狸与葡萄', { at: 5.6, fx: 'up', size: 28, color: '#8A7466', align: 'center', out: 9.6, outFx: 'fade', fixed: true, style: 'white-space:nowrap', pos: { x: 640, y: 196, anchor: 'center' } }),
    vk.small('绘本动画：vidkit 逐帧生成 · 旁白与配乐：代码合成', { at: 7.6, fx: 'fade', size: 19, color: '#A2907F', out: 9.8, outFx: 'fade', fixed: true, pos: { x: 640, y: 644, anchor: 'center' } }),
  );

  [.4, 1.0, 1.6, 2.2, 2.8, 3.4, 4.0, 4.6, 5.2, 5.9, 6.6].forEach(t => sc.sfx(t, 'step', .38));
  sc.sfx(4.4, 'chime', .4, 523.25); sc.sfx(5.0, 'pluck', .35, 392); sc.sfx(5.6, 'pluck', .3, 261.63);
});
</script>
