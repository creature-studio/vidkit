<!doctype html><meta charset="utf-8"><title>agent-test</title><body>
<script src="../../dist/vidkit.js"></script>
<script src="../../dist/vidkit-three.js"></script>
<script>
// ~10 s: tech style (2D) + raw canvas + a small vk.three element. Built from llms.txt + AGENTS.md only.
const v = vk.video({ format: '16:9', fps: 30, style: 'tech', transition: 'push-left:0.5' });

// 1 · title over a raw-canvas starfield (stateless: position = f(i, t))
vk.scene('open', 4, { cap: 'Every frame is a function of time' }, sc => {
  sc.canvas((g, local) => {
    for (let i = 0; i < 260; i++) {
      const sp = .3 + vk.hash(i) * .7, a = vk.hash(i + 999) * Math.PI * 2;
      const r = ((vk.hash(i + 77) * 700 + local * 220 * sp) % 700);
      const x = 640 + Math.cos(a) * r, y = 360 + Math.sin(a) * r * .62;
      g.globalAlpha = Math.min(1, r / 300) * .8; g.fillStyle = '#7fd8ff';
      g.fillRect(x, y, 2 + sp * 2, 2 + sp * 2);
    }
    g.globalAlpha = 1;
  }, { z: 'back' });
  sc.add(vk.label('VIDKIT', { at: 0, fx: false }));                       // visible on frame 0 (the thumbnail)
  sc.add(vk.title('One page.\nOne video.', { fx: 'letters', at: .2 }));
  sc.add(vk.sub('HTML in · **MP4** out', { at: 1.3 }));
});

// 2 · a small chrome knot (vk.three) next to 2D copy
vk.scene('three', 3.8, { transition: 'wipe-left:0.5', cap: 'Real 3D on the same timeline' }, sc => {
  sc.three(async ({ THREE, scene, load }) => {
    scene.environment = await load.env('studio');
    const m = new THREE.Mesh(new THREE.TorusKnotGeometry(1, .32, 200, 32), vk.three.materials.anodized({ env: 1.6 }));
    scene.add(m);
    return local => { m.rotation.y = local * .9; m.rotation.x = .3 + .2 * Math.sin(local * 1.3); };
  }, { rect: [700, 110, 500, 500], camera: { pos: [0, 0, 6.5], target: [0, 0, 0] }, res: .75, post: { bloom: { strength: .35 } } });
  sc.add(vk.h2('Real **3D**,\nsame timeline', { pos: { x: 90, y: 250 }, align: 'left', fx: 'reveal', at: .3 }));
  sc.add(vk.small('vk.three · three r186', { pos: { x: 90, y: 430 }, at: 1.1 }));
});

// 3 · the loop
vk.scene('loop', 3.3, { transition: 'iris:0.6', cap: 'Lint, peek, render' }, [
  vk.stack(['lint', 'peek', 'render'], { w: .2, at: .2 }),
  vk.badge('deterministic', { at: 1.4 }),
]);
</script>
