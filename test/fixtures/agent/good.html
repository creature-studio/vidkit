<script src="../../../dist/vidkit.js"></script>
<script>
// test fixture: a clean 4 s page (vk lint / vk peek must report no errors)
vk.video({ format: '16:9', fps: 30, theme: 'tech-blue' });
vk.scene('a', 2, { bg: 'dark' }, [vk.label('FIXTURE', { at: 0, fx: false }), vk.title('Good page', { at: .1 })]);
vk.scene('b', 2.4, { bg: 'light', transition: 'fade:0.4' }, sc => {
  sc.add(vk.h2('Stateless canvas'));
  sc.canvas((g, local) => { for (let i = 0; i < 40; i++) { g.fillStyle = '#3355ff'; g.fillRect(100 + i * 27, 600 + 30 * Math.sin(local * 2 + vk.hash(i) * 6), 8, 8); } }, { z: 'back' });
});
</script>
